# Builds installable artifacts:
#   - standalone Go binaries for macOS (arm64/amd64), Windows and Linux
#   - native desktop installers (.dmg / .exe) via Electron on mac/windows runners
#
# Runs on every v* tag (attaching everything to a GitHub Release) and can be
# run manually from the Actions tab (artifacts downloadable from the run).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Go binaries (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cross-compile
        run: make cross
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: devtil-binaries
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*

  desktop:
    name: Desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: "desktop/dist/*.dmg"
          - os: windows-latest
            artifact: "desktop/dist/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build backend (mac universal — runs on both Apple Silicon & Intel)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          GOARCH=arm64 go build -o bin/devtil-arm64 .
          GOARCH=amd64 go build -o bin/devtil-amd64 .
          lipo -create -output bin/devtil bin/devtil-arm64 bin/devtil-amd64
          rm bin/devtil-arm64 bin/devtil-amd64
          file bin/devtil
      - name: Build backend (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go build -o bin/devtil.exe .
      - name: Build installer
        shell: bash
        working-directory: desktop
        env:
          # no paid Apple/Windows cert: builds are ad-hoc signed (mac) and
          # unsigned (win). Users clear the download quarantine on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: devtil-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: ${{ matrix.artifact }}
