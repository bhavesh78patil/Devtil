<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Devtil app icon: the toolbox from the product's own identity, drawn in
       its palette (warm cream ground, Zapier-orange accent, coffee ink). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#f1ebe3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a2b"/>
      <stop offset="1" stop-color="#ff4f00"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#201515" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- macOS/Windows both mask to their own shape; a full-bleed rounded square
       is the safe canvas that survives either. -->
  <rect width="1024" height="1024" rx="228" fill="url(#ground)"/>

  <g filter="url(#lift)">
    <!-- handle -->
    <path d="M392 300 v-36 a56 56 0 0 1 56-56 h128 a56 56 0 0 1 56 56 v36"
          fill="none" stroke="#201515" stroke-width="46" stroke-linecap="round"/>
    <!-- lid -->
    <rect x="176" y="300" width="672" height="176" rx="46" fill="url(#body)"/>
    <!-- case -->
    <rect x="176" y="452" width="672" height="368" rx="52" fill="#201515"/>
    <!-- the latch, in the accent so the two halves read as one object -->
    <rect x="454" y="428" width="116" height="96" rx="26" fill="#ff4f00"/>
    <rect x="486" y="462" width="52" height="30" rx="15" fill="#201515"/>
  </g>
</svg>
