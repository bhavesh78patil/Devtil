<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Devtil — Developer Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090c'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='6.5' fill='none' stroke='%2373d13d' stroke-opacity='.45'/%3E%3Cpath d='m9 11 5 5-5 5' fill='none' stroke='%2373d13d' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16.5 22h7' stroke='%2373d13d' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-opacity=".45"/>
        <path d="m9 11 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.5 22h7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Dev<b>til</b></span>
        <span class="brand-tag">Developer workbench</span>
      </div>
    </div>
    <div class="sidebar-head">
      <span>Workspaces</span>
      <button id="add-workspace" class="icon-btn" title="New workspace">+</button>
    </div>
    <div class="sidebar-search">
      <input id="tab-search" type="search" placeholder="Search tabs…" autocomplete="off">
    </div>
    <ul id="workspace-list"></ul>
    <div class="sidebar-foot">
      <label class="theme-row">Theme
        <select id="theme-select">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <button id="open-settings" class="btn settings-btn" title="Settings (MCP server, agents)">Settings · MCP</button>
      <span id="save-indicator" class="saved">All changes saved</span>
    </div>
  </aside>
  <main id="main">
    <div id="tabbar">
      <button id="nav-toggle" class="icon-btn" title="Show/hide the workspace sidebar">☰</button>
      <div id="tabs"></div>
      <button id="add-tab" class="icon-btn" title="New tab (pick a tool)">+</button>
    </div>
    <div id="tool-root"></div>
  </main>
</div>

<div id="picker-overlay" class="hidden">
  <div id="picker">
    <div class="picker-head">
      <div class="picker-title">
        <div>
          <span class="eyebrow">New tab</span>
          <h2>Pick a <em>tool.</em></h2>
        </div>
        <button id="picker-close" class="icon-btn" title="Close (Esc)">×</button>
      </div>
      <input id="picker-search" type="search" placeholder="Search tools — Kafka, JSON, SQL, SSH…" autocomplete="off" spellcheck="false">
    </div>
    <div id="picker-grid"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
